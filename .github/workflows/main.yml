name: Windows AnyDesk

on:
  workflow_dispatch:
    inputs:
      anydesk_password:
        description: 'Senha do AnyDesk'
        required: true
        default: 'MudarSenha123!'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Instalar AnyDesk
        run: |
          choco install anydesk.install -y --no-progress

      - name: Iniciar Servico e Mostrar ID
        run: |
          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          Start-Process -FilePath $anydesk
          Start-Sleep -Seconds 15
          echo ${{ github.event.inputs.anydesk_password }} | & $anydesk --set-password
          for ($i = 1; $i -le 10; $i++) {
            $id = & $anydesk --get-id
            if ($id -match '^\d+$') { break }
            Start-Sleep -Seconds 5
          }
          Write-Host "========================================="
          Write-Host "SEU ID DO ANYDESK E: $id"
          Write-Host "========================================="

      - name: Manter Ativo
        run: |
          Start-Sleep -Seconds 21000
