name: Windows AnyDesk

on:
  workflow_dispatch:
    inputs:
      anydesk_password:
        description: 'Senha do AnyDesk'
        required: true
        default: 'MudarSenha123!'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Instalar AnyDesk
        run: |
          choco install anydesk.install -y --no-progress

      - name: Configurar e Mostrar ID
        run: |
          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          Start-Process -FilePath $anydesk
          Start-Sleep -Seconds 15
          cmd /c "echo ${{ github.event.inputs.anydesk_password }} | `"$anydesk`" --set-password"
          Start-Sleep -Seconds 5
          
          $confPath = "C:\ProgramData\AnyDesk\system.conf"
          for ($i = 1; $i -le 12; $i++) {
            if (Test-Path $confPath) {
              $line = Get-Content $confPath | Select-String "ad.anynet.id="
              if ($line) {
                $id = $line.ToString().Split("=")[1]
                break
              }
            }
            Start-Sleep -Seconds 5
          }

          Write-Host "========================================="
          Write-Host "SEU ID DO ANYDESK E: $id"
          Write-Host "========================================="

      - name: Manter Ativo
        run: |
          Start-Sleep -Seconds 21000
